<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
<header class="site">
  <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <div class="tagline">{{ site.tagline }}</div>
</header>

{{ content }}

<footer class="site">
  <a href="https://github.com/{{ site.github_username }}">github.com/{{ site.github_username }}</a> ·
  <a href="{{ '/feed.xml' | relative_url }}">feed</a> ·
  <a href="mailto:hello@gracefulco.de">hello@gracefulco.de</a>
</footer>
</body>
</html>
