title: Grace L. Christenbery's Blog
tagline: Full-stack engineer — distributed systems, observability, ML infrastructure
description: >-
  Browser interfaces, the services behind them, and the instrumentation that
  shows what actually happened: distributed tracing, telemetry pipelines, ML
  infrastructure, and tools you can run yourself.
url: https://grace.github.io
# Without this Jekyll normalizes post dates to UTC, so an evening post
# published on the 4th appears as the 5th.
timezone: America/New_York
github_username: Grace

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true

exclude: [Gemfile, Gemfile.lock, README.md, vendor]
